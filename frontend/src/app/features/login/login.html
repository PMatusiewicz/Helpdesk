<div class="d-flex justify-content-center">
    <div class="card mt-5" style="width: 24rem;">
        <div class="card-body">
            <h1 class="card-title mb-4">Login</h1>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="username" class="form-label">Nazwa użytkownika</label>
                    <input type="text" formControlName="username" id="username" class="form-control">
                    @if (loginForm.get("username")?.errors?.["backend"]) {
                        <div class="text-danger small mt-1">{{ loginForm.get("username")?.errors?.["backend"] }}</div>
                    }
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Hasło</label>
                    <input type="password" formControlName="password" id="password" class="form-control">
                    @if (loginForm.get("password")?.errors?.["backend"]) {
                        <div class="text-danger small mt-1">{{ loginForm.get("password")?.errors?.["backend"] }}</div>
                    }
                </div>
                <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
            </form>
            @if (errorMessage()) {
                <div class="text-danger small mt-3">{{ errorMessage() }}</div>
            }
            <div class="mt-3 text-center">
                <a routerLink="/register">Rejestracja</a>
            </div>
        </div>
    </div>
</div>
