<div class="d-flex justify-content-center">
    <div class="card mt-5 mb-5" style="width: 28rem;">
        <div class="card-body">
            <h1 class="card-title mb-4">Nowe zgłoszenie</h1>
            <form [formGroup]="reportForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="title" class="form-label">Tytuł</label>
                    <input type="text" id="title" formControlName="title" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Opis</label>
                    <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Kategoria</label>
                    <select id="category" formControlName="category" class="form-select">
                        @for (category of categories(); track category.id) {
                            <option [value]="category.id">{{ category.name }}</option>
                        }
                    </select>
                </div>
                <div class="mb-3">
                    <label for="priority" class="form-label">Priorytet</label>
                    <select id="priority" formControlName="priority" class="form-select">
                        <option value="CRITICAL">Krytyczny</option>
                        <option value="HIGH">Wysoki</option>
                        <option value="MEDIUM">Średni</option>
                        <option value="LOW">Niski</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Utwórz</button>
            </form>
            @if (errorMessage()) {
                <div class="text-danger small mt-3">{{ errorMessage() }}</div>
            }
        </div>
    </div>
</div>
